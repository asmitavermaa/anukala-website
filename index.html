<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f3ee;
            font-family: Georgia, "Times New Roman", serif;
            color: #2d2926;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 650px;
        }

        .logo {
            max-width: 220px;
            max-height: 150px;
            object-fit: contain;
            margin-bottom: 45px;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 22px;
            opacity: 0.65;
        }

        h1 {
            font-size: clamp(48px, 8vw, 82px);
            font-weight: normal;
            line-height: 1;
            margin-bottom: 25px;
        }

        .description {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto 35px;
            opacity: 0.75;
        }

        .line {
            width: 60px;
            height: 1px;
            background: #2d2926;
            margin: 0 auto 30px;
            opacity: 0.5;
        }

        .social {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .social a {
            color: #2d2926;
            text-decoration: none;
            margin: 0 12px;
        }

        .social a:hover {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <main class="container">

        <img src="logo.png" alt="Art Business Logo" class="logo">

        <div class="eyebrow">A new collection is coming</div>

        <h1>Coming Soon</h1>

        <div class="line"></div>

        <p class="description">
            Something beautiful is taking shape.
            Stay tuned.
        </p>

        <div class="social">
            <a href="#">Instagram</a>
            <a href="#">Contact</a>
        </div>

    </main>

</body>
</html>
